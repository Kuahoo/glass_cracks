# E4 (plan v4, M2): E1 + robustness augmentation, train split only. Built on E1 (4 classes), the Track A winner.
# Downscale-heavy scale jitter (drone-distance crack widths), stronger brightness/saturation shifts,
# motion blur (drone vibration) and heavy JPEG compression. Compare with E1, threshold-free (compare_runs).
# The earlier E4 recipe (scale/colour only, E4_s0 on TIDE) is archived as E4old; see the TIDE notebook.
base: e1_yolo_4class.yaml
exp_id: E4
notes: "scale/colour/motion-blur/jpeg aug"
train:
  scale: 0.7
  hsv_s: 0.7
  hsv_v: 0.5
albu:                        # Albumentations pixel transforms (replace Ultralytics' p=0.01 defaults)
  - MotionBlur: {blur_limit: [3, 15], p: 0.3}
  - ImageCompression: {quality_range: [15, 60], p: 0.3}
