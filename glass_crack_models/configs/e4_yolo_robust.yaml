# E4 starting point (Phase 4, step 1) if Track A wins: scale and appearance augmentation Roboflow did not apply.
# Downscale-heavy scale jitter pushes cracks toward drone-distance pixel sizes; colour shifts beyond +-15%.
# No extra blur/noise (already on the Roboflow pair copies).
base: e2_yolo_linear.yaml
exp_id: E4
notes: "scale/appearance aug"
train:
  epochs: 150
  imgsz: 640
  batch: 16
  patience: 40
  cos_lr: true
  close_mosaic: 15
  flipud: 0.5
  fliplr: 0.5
  degrees: 0.0
  workers: 4
  scale: 0.7
  hsv_v: 0.5
  hsv_s: 0.7
